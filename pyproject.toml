[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video2knowledge"
version = "0.1.0"
description = "Local-first Bilibili video transcription and knowledge-library pipeline"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["bilibili", "mlx", "speech-to-text", "transcription", "whisper"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
bilibili = ["bilibili-api-python>=17,<18", "yt-dlp>=2025.1"]
audio = ["av>=14,<19"]
mlx = ["mlx-audio>=0.2"]
dev = ["build>=1.2,<2", "pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
v2k = "video2knowledge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/video2knowledge"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/README.zh-CN.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/config.example.json",
  "/docs",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
